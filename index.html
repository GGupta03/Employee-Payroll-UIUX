<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Payroll</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="top-header">
    <h1>Employee Payroll</h1>
  </header>

  <main class="main-container">
    <div class="payroll-box">

      <header class="box-header">
        <h2>Employee Payroll Form</h2>
      </header>

      <form id="payrollForm" class="payroll-form">
        <div class="form-group">
          <label>Employee Name</label>
          <input type="text" id="empName" placeholder="Enter employee name" required />
        </div>

        <div class="form-group">
          <label>Salary</label>
          <input type="number" id="salary" placeholder="Enter salary" required />
        </div>

        <div class="form-group">
          <label>Department</label>
          <select id="department" required>
            <option value="">Select</option>
            <option>HR</option>
            <option>Finance</option>
            <option>Engineering</option>
            <option>Sales</option>
            <option>Marketing</option>
          </select>
        </div>

        <div class="form-group">
          <label>Start Date</label>
          <input type="date" id="startDate" required />
        </div>

        <div class="form-actions">
          <button type="reset" class="btn btn-cancel">Cancel</button>
          <button type="submit" class="btn btn-submit">Submit</button>
        </div>
      </form>

      <p id="output" class="output"></p>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
